<body>
<section class="auth-gate" id="authGate" aria-live="polite"><div class="auth-card"><div class="auth-brand"><span>✳</span> 日常拾光</div><h1>把日常收進來</h1><p id="authMessage">請使用 Google 帳號登入，開始使用你的行程與任務。</p><button class="google-login auth-gate-button" id="gateGoogleLogin" type="button"><span class="google-mark" aria-hidden="true">G</span>使用 Google 登入</button><small id="authHint">登入後即可使用個人行程清單與寵物夥伴。</small></div></section>
<div class="app" id="appShell" hidden>
<aside class="sidebar"><div class="brand"><div class="brand-icon">✳</div>日常拾光</div><div class="nav-label">日常</div><nav class="nav"><button class="active" data-page="today"><span class="nav-ico">◷</span>每日清單</button></nav><div class="side-bottom"><div class="sync"><span class="sync-dot"></span>資料已儲存於此裝置</div><small>跨裝置同步尚未連接帳號服務。你的資料會保存在本機瀏覽器。</small></div></aside>
<main class="main"><div class="topbar"><div class="greeting" id="greeting">把重要的日子，好好收進來。</div><div class="auth-actions"><span class="auth-user" id="authUser" hidden></span><button class="google-login" id="googleLogin" type="button"><span class="google-mark" aria-hidden="true">G</span>使用 Google 登入</button><button class="google-login" id="googleLogout" type="button" hidden>登出</button></div></div>
<section id="mainPage"><div class="reminder-banner" id="reminderBanner"></div><div class="date-nav"><div><h1 class="date-title" id="dateTitle"></h1><div class="date-sub" id="dateSubtitle"></div></div><div class="date-arrows"><button class="today-btn" id="todayBtn">今天</button><button class="icon-btn" id="prevDay" aria-label="前一天">‹</button><button class="icon-btn" id="nextDay" aria-label="後一天">›</button></div></div><div class="daystrip" id="daystrip"></div><div class="daily-insight" id="dailyInsight" aria-live="polite"></div>
<div class="section-head"><h2>今天要做的事 <span class="count" id="count"></span></h2><button class="add-btn" id="addTask">＋ 新增事項</button></div><div class="task-list" id="taskList"></div><section class="section-head" style="margin-top:29px"><h2>已完成 <span class="count" id="doneCount"></span></h2></section><div class="task-list" id="doneList"></div><section class="pet-inline"><div class="section-head"><h2>我的夥伴 <span class="count">陪牠一下，看看牠的日常</span></h2><button class="pet-move" id="movePet">↕ 移動</button></div><div class="pet-inline-grid"><div class="pet-card" id="petCard"></div><div class="collection"><div class="collection-title">寵物收藏 <span id="collectionCount"></span></div><div class="pets" id="petsRow"></div><div class="hint"><b>慢慢來，也很好 🌱</b>完成事項為夥伴累積經驗，沒有期限，也不會失去進度。</div></div></div></section></section>
<section class="page-other" id="otherPage"></section></main>
</div>

<div class="overlay" id="taskModal"><div class="modal"><div class="modal-head"><h2 id="formTitle">新增事項</h2><button class="close" data-close>✕</button></div><form id="taskForm"><input type="hidden" id="taskId"><div class="field"><label for="taskName">事項名稱</label><input id="taskName" required maxlength="80" placeholder="例如：買牛奶、看牙醫、交報告"></div><div class="row"><div class="field"><label for="taskDate">日期</label><input type="date" id="taskDate" required></div><div class="field"><label for="taskTime">時間（選填）</label><input type="time" id="taskTime"></div></div><div class="row"><div class="field"><label for="taskRepeat">重複</label><select id="taskRepeat"><option value="none">不重複</option><option value="daily">每天</option><option value="weekly">每週</option><option value="monthly">每月</option></select></div><div class="field"><label>事項顏色</label><div class="colors" id="colorChoices"></div></div></div><div class="field"><label for="taskNote">備註（收在事項詳情）</label><textarea id="taskNote" rows="3" placeholder="點開事項時才會看到這裡的內容"></textarea></div><div class="modal-actions"><button type="button" class="secondary" data-close>取消</button><button type="submit" class="primary">儲存事項</button></div></form></div></div>
<div class="overlay" id="detailModal"><div class="modal"><div class="modal-head"><h2 id="detailTitle"></h2><button class="close" data-close>✕</button></div><div id="detailContent"></div><div class="modal-actions"><button class="secondary" id="editTask">編輯</button><button class="primary" data-close>完成</button></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='dailyLight_v1', today=new Date();today.setHours(0,0,0,0);const iso=d=>{let x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};let selected=iso(today), selectedPet='moss', currentDetail=null;

const petsData=[{id:'moss',name:'苔苔',emoji:'🐢',desc:'慢慢走也能抵達想去的地方。',unlock:0},{id:'mimi',name:'米米',emoji:'🐱',desc:'喜歡曬太陽和安靜的午後。',unlock:12},{id:'puff',name:'泡泡',emoji:'🐰',desc:'把小小的快樂分給每一天。',unlock:28},{id:'sprout',name:'芽芽',emoji:'🐸',desc:'在新葉冒出的時候最開心。',unlock:55}];
function seed(){let s={tasks:[],xp:0,unlocked:['moss'],petActions:{},lastReminded:{}};let d=new Date(today);const examples=[['喝一杯水，伸展一下','08:30','#e8a4a4','照顧一下今天的自己。'],['整理工作桌','10:00','#94b7de',''],['買晚餐食材','17:30','#8ec5a0','記得順便買水果。'],['給家人打電話','','#d8ad7c','']];for(let n=-2;n<=4;n++){let dt=new Date(d);dt.setDate(d.getDate()+n);examples.forEach((e,i)=>{if((n===0)||(n===1&&i===2)||(n===-1&&i<2)||(n===2&&i===0)){s.tasks.push({id:crypto.randomUUID(),title:e[0],date:iso(dt),time:e[1],color:e[2],note:e[3],repeat:'none',done:n<0&&i===0})}})}return s}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||seed()}catch{state=seed()}function save(){localStorage.setItem(KEY,JSON.stringify(state))}if(!state.tasks?.length)state=seed();state.tasks.forEach(t=>{if(t.category&&!t.color.startsWith('#'))t.color=({green:'#8ec5a0',blue:'#94b7de',pink:'#e8a4a4',orange:'#d8ad7c'})[t.color]||'#8ec5a0';delete t.category});save();
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], colorMap={'#8ec5a0':'薄荷綠','#94b7de':'天空藍','#e8a4a4':'柔霧粉','#e7bf78':'奶油黃','#b8a0d5':'薰衣草','#d8ad7c':'暖杏色','#91b8b0':'湖水綠','#b6bec8':'霧灰'};
function dateOf(s){return new Date(s+'T00:00:00')}function human(d){return new Intl.DateTimeFormat('zh-TW',{month:'long',day:'numeric',weekday:'long'}).format(d)}function render(){let d=dateOf(selected);renderDailyInsight();$('#dateTitle').textContent=human(d);let delta=Math.round((d-today)/86400000);$('#dateSubtitle').textContent=delta===0?'把今天過成你喜歡的樣子':delta<0?`${Math.abs(delta)} 天前的日常`:`還有 ${delta} 天，先安排也很好`;let start=new Date(d);start.setDate(start.getDate()-3);$('#daystrip').innerHTML=Array.from({length:7},(_,i)=>{let x=new Date(start);x.setDate(start.getDate()+i);let key=iso(x), dayName=['日','一','二','三','四','五','六'][x.getDay()],has=state.tasks.some(t=>t.date===key);return `<button class="day ${key===selected?'selected':''} ${has?'has':''}" data-date="${key}"><b>${key===iso(today)?'今天':'週'+dayName}</b><span>${x.getDate()}</span></button>`}).join('');$$('.day').forEach(b=>b.onclick=()=>{selected=b.dataset.date;render()});let tasks=state.tasks.filter(t=>t.date===selected).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));let open=tasks.filter(t=>!t.done),done=tasks.filter(t=>t.done);$('#count').textContent=`${open.length} 件`;$('#doneCount').textContent=`${done.length} 件`;$('#taskList').innerHTML=open.length?open.map(taskHtml).join(''):`<div class="empty">${selected===iso(today)?'今天還沒有安排，留一點空白也很好。':'這一天目前沒有事項。'}<br><button class="add-btn" style="margin-top:13px" onclick="openForm()">＋ 新增一件事</button></div>`;$('#doneList').innerHTML=done.length?done.map(taskHtml).join(''):`<div style="color:#a5aea7;font-size:12px;padding:8px 2px">完成的事項會安靜地留在這裡。</div>`;wireTasks();renderPet();renderReminder()}
function renderDailyInsight(){let box=$('#dailyInsight');if(!box)return;let dayTasks=state.tasks.filter(t=>t.date===selected),open=dayTasks.filter(t=>!t.done),done=dayTasks.length-open.length,weekday=dateOf(selected).getDay();let prompts=['今天的你，只要完成一件重要的小事就很棒了。','記得安排一點休息，行程不用塞滿才算充實。','先從最容易的一件開始，替自己累積一點動力。','留一點空白給意外的好事，也留一點時間給自己。','每個勾選都是進步，不必一次做到完美。','喝口水、伸展一下，讓今天過得舒服一點。','慢慢來也沒關係，穩穩完成就是很棒的節奏。'];let text,icon;if(!dayTasks.length){text='這天還沒有安排，留白也很美好。要不要先放進一件小事？';icon='🌱'}else if(open.length===0){text='今天的清單全數完成！你和夥伴都值得一個小小慶祝。';icon='🎉'}else if(done){text='已完成 '+done+' 件，還有 '+open.length+' 件。你已經在前進了！';icon='✨'}else{text=prompts[weekday];icon='☀️'}let next=open.find(t=>t.time);box.innerHTML='<span class="insight-icon" aria-hidden="true">'+icon+'</span><span><b>'+text+'</b>'+(next?'　下一個有時間的事項：'+escapeHtml(next.title)+' · '+next.time:'')+'</span><button type="button" id="quickAddTask">＋ 加一件</button>';$('#quickAddTask').onclick=()=>openForm()}
function taskHtml(t){return `<article class="task ${t.done?'done':''}" data-id="${t.id}" style="--task-color:${t.color||'#8ec5a0'}"><span class="task-colorbar"></span><button class="check" aria-label="${t.done?'取消完成':'標記完成'}">${t.done?'✓':''}</button><div class="task-body"><div class="task-name">${escapeHtml(t.title)}</div><div class="task-meta">${t.repeat!=='none'?`<span class="task-repeat">↻ ${repeatText(t.repeat)}</span>`:''}</div></div><span class="task-time">${t.time||'時間未定'}</span><button class="more" aria-label="更多選項">···</button></article>`}
function repeatText(r){return {daily:'每天',weekly:'每週',monthly:'每月'}[r]||''}function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function wireTasks(){$$('.task').forEach(el=>{let t=state.tasks.find(x=>x.id===el.dataset.id);el.querySelector('.check').onclick=e=>{e.stopPropagation();t.done=!t.done;if(t.done){state.xp+=5;unlockPets();toast('完成一件事，夥伴獲得 5 點經驗 ✨')}save();render()};el.querySelector('.task-body').onclick=()=>showDetail(t);el.querySelector('.more').onclick=()=>showDetail(t);el.querySelector('.task-time').onclick=()=>showDetail(t)})}
function petSprite(id){const p={moss:['#74a88b','#416b58','#a7ceb2'],mimi:['#d8a969','#9a693d','#f0d39e'],puff:['#eee7d9','#aaa18f','#fff9ed'],sprout:['#83bc82','#4d8654','#b8dc9e']}[id]||['#74a88b','#416b58','#a7ceb2'];return `<svg class="pet-sprite-svg" viewBox="0 0 64 80" role="img" aria-label="全身像素寵物" shape-rendering="crispEdges"><rect x="14" y="7" width="8" height="12" fill="${p[1]}"/><rect x="42" y="7" width="8" height="12" fill="${p[1]}"/><rect x="16" y="9" width="4" height="7" fill="${p[2]}"/><rect x="44" y="9" width="4" height="7" fill="${p[2]}"/><rect x="12" y="16" width="40" height="25" fill="${p[1]}"/><rect x="16" y="14" width="32" height="25" fill="${p[0]}"/><g class="pet-eye"><rect x="20" y="19" width="5" height="5" fill="#26352f"/><rect x="21" y="20" width="2" height="2" fill="white"/></g><g class="pet-eye"><rect x="39" y="19" width="5" height="5" fill="#26352f"/><rect x="40" y="20" width="2" height="2" fill="white"/></g><rect x="15" y="29" width="6" height="3" fill="#e9a4a4"/><rect x="43" y="29" width="6" height="3" fill="#e9a4a4"/><rect x="29" y="29" width="6" height="4" fill="${p[1]}"/><rect x="20" y="40" width="24" height="23" fill="${p[1]}"/><rect x="23" y="40" width="18" height="20" fill="${p[0]}"/><rect x="27" y="43" width="10" height="13" fill="${p[2]}"/><rect x="15" y="46" width="8" height="8" fill="${p[0]}"/><rect x="41" y="46" width="8" height="8" fill="${p[0]}"/><rect x="20" y="61" width="10" height="9" fill="${p[1]}"/><rect x="34" y="61" width="10" height="9" fill="${p[1]}"/><rect x="18" y="68" width="13" height="5" fill="${p[0]}"/><rect x="33" y="68" width="13" height="5" fill="${p[0]}"/></svg>`}
let petMood='在草地上散步 ♡',petIdleTimer;function startPetIdle(){clearInterval(petIdleTimer);petIdleTimer=setInterval(()=>{let scene=$('#petScene');if(!scene)return;let act=Math.floor(Math.random()*4);scene.classList.remove('pet-walk','pet-sleeping','pet-blink');if(act===0){petMood='蹦蹦跳跳地散步';scene.classList.add('pet-walk')}else if(act===1){petMood='找到一朵小花！';petFeedback('發現小花 ✿','pet-playing')}else if(act===2){petMood='打個盹，做個好夢';scene.classList.add('pet-sleeping')}else{petMood='好奇地看看你 ♡';scene.classList.add('pet-blink')}let e=$('#petMood');if(e)e.textContent=petMood},3900)}function petFeedback(text,anim='pet-playing'){let scene=$('#petScene');if(!scene)return;scene.classList.remove('pet-playing','pet-eating','pet-sleeping','pet-walk');void scene.offsetWidth;scene.classList.add(anim);let b=document.createElement('span');b.className='pet-action-float';b.textContent=text;scene.append(b);let x=document.createElement('span');x.className='pet-sparks';x.textContent='✦';scene.append(x);setTimeout(()=>{scene.classList.remove(anim);b.remove();x.remove()},1800)}function movePet(){let x=$('.pet-inline');x.classList.toggle('pet-moved');toast(x.classList.contains('pet-moved')?'夥伴移到清單上方':'夥伴移回清單下方')}
function renderPet(){let pet=petsData.find(p=>p.id===selectedPet)||petsData[0],level=1+Math.floor(state.xp/20),pct=state.xp%20*5;let card=`<div class="pet-intro"><div><div class="pet-name">${pet.name}</div><div class="pet-desc" style="margin-top:4px">${pet.desc}</div></div><span class="pet-level">Lv. ${level}</span></div><div class="pet-scene" id="petScene"><span class="sun"></span><span class="flower f1">✿</span><span class="flower f2">✿</span><span class="flower f3">✦</span><span class="grass"></span><button class="pet-pixel" id="petSprite" title="點一下摸摸牠" aria-label="摸摸寵物">${petSprite(pet.id)}</button><span class="pixel-label" id="petMood">${petMood}</span></div><div class="pet-desc">你的日常，就是牠成長的小小養分。</div><div class="xp-row"><span>下一階段</span><span>${state.xp%20} / 20 EXP</span></div><div class="progress"><span style="width:${pct}%"></span></div><div class="pet-actions"><button onclick="petAction('feed')">🍪 餵零食</button><button onclick="petAction('play')">🧶 丟玩具</button><button onclick="petAction('watch')">👀 看牠玩</button></div>`;$('#petCard').innerHTML=card;$('#petSprite').onclick=()=>petAction('pet');startPetIdle();$('#petsRow').innerHTML=petsData.map(p=>{let unlocked=state.unlocked.includes(p.id);return `<button class="pet-mini ${unlocked?'':'locked'}" title="${unlocked?p.name:`完成 ${p.unlock} 件事項即可收藏`}" onclick="selectPet('${p.id}')">${unlocked?p.emoji:'?'}</button>`}).join('');$('#collectionCount').textContent=`${state.unlocked.length} / ${petsData.length}`}
function unlockPets(){petsData.forEach(p=>{if(state.xp>=p.unlock*5&&!state.unlocked.includes(p.id)){state.unlocked.push(p.id);toast(`新夥伴「${p.name}」加入收藏！${p.emoji}`)}})}function selectPet(id){if(!state.unlocked.includes(id)){toast('多完成一些日常，就有機會遇見新夥伴 🌱');return}selectedPet=id;renderPet();toast('今天的夥伴已切換')}function petAction(type){if(type==='watch'){petFeedback('牠開心地轉了一圈！');petMood='轉圈圈給你看 ✨';$('#petMood').textContent=petMood;return}if(type==='pet'){petFeedback('啾！摸摸最喜歡了 ♡');petMood='被摸摸後好開心 ♡';$('#petMood').textContent=petMood;return}let k=iso(today);state.petActions[k]=(state.petActions[k]||0)+1;save();if(type==='feed'){petFeedback('啊姆！好吃的餅乾 🍪','pet-eating');petMood='吃飽後滿足地晃晃';$('#petMood').textContent=petMood;toast('點心送到啦，牠開心地吃掉了 🍃')}else{petFeedback('追到毛線球了！🧶');petMood='玩累了，心情很好';$('#petMood').textContent=petMood;toast('你們度過了一段愉快時光 ✨')}}
function renderReminder(){let now=new Date(),banner=$('#reminderBanner');let due=state.tasks.filter(t=>t.date===iso(today)&&t.time&&!t.done).filter(t=>{let [h,m]=t.time.split(':').map(Number),when=new Date();when.setHours(h,m,0,0);return when<=now&&now-when<3600000&&!state.lastReminded[t.id]});if(due.length){banner.style.display='block';banner.innerHTML=`⏰ 提醒：${due.map(t=>escapeHtml(t.title)).join('、')}<button style="float:right;background:transparent;color:inherit" onclick="dismissReminders()">知道了</button>`}else banner.style.display='none'}function dismissReminders(){state.tasks.filter(t=>t.date===iso(today)).forEach(t=>state.lastReminded[t.id]=true);save();renderReminder()}
function openForm(task){$('#taskModal').classList.add('show');$('#taskForm').reset();$('#taskId').value=task?.id||'';$('#formTitle').textContent=task?'編輯事項':'新增事項';$('#taskName').value=task?.title||'';$('#taskDate').value=task?.date||selected;$('#taskTime').value=task?.time||'';$('#taskNote').value=task?.note||'';$('#taskRepeat').value=task?.repeat||'none';buildColors(task?.color||'#8ec5a0')}
function buildColors(selectedColor){$('#colorChoices').innerHTML=Object.entries(colorMap).map(([k,v])=>`<button type="button" title="${v}" aria-label="選擇${v}" class="color-choice ${k===selectedColor?'active':''}" data-color="${k}" style="background:${k}"></button>`).join('');$$('.color-choice').forEach(b=>b.onclick=()=>{$$('.color-choice').forEach(x=>x.classList.remove('active'));b.classList.add('active')})}
function showDetail(t){currentDetail=t;$('#detailTitle').textContent=t.title;$('#detailContent').innerHTML=`<div class="detail-meta"><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${t.color||'#8ec5a0'}"></span><span>${human(dateOf(t.date))}</span><span>${t.time||'時間未定'}</span>${t.repeat!=='none'?`<span>↻ ${repeatText(t.repeat)}</span>`:''}</div><div class="detail-note">${t.note?escapeHtml(t.note):'沒有備註。'}</div><div class="subtle"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${t.color||'#8ec5a0'};margin-right:5px"></span>${t.done?'已完成 ✓':'尚未完成'} · 這項紀錄會留在原本日期，不會自動移到隔天。</div>`;$('#detailModal').classList.add('show')}
$('#taskForm').onsubmit=e=>{e.preventDefault();let id=$('#taskId').value,old=state.tasks.find(t=>t.id===id),c=$('.color-choice.active')?.dataset.color||'#8ec5a0',obj={id:id||crypto.randomUUID(),title:$('#taskName').value.trim(),date:$('#taskDate').value,time:$('#taskTime').value,color:c,note:$('#taskNote').value.trim(),repeat:$('#taskRepeat').value,done:old?.done||false};if(old)Object.assign(old,obj);else{state.tasks.push(obj);if(obj.repeat!=='none')addRepeatInstances(obj)}save();selected=obj.date;$('#taskModal').classList.remove('show');render();toast(old?'事項已更新':'事項已加入清單')};function addRepeatInstances(t){let count=t.repeat==='daily'?29:t.repeat==='weekly'?12:11;for(let i=1;i<=count;i++){let d=dateOf(t.date);d.setDate(d.getDate()+i*(t.repeat==='daily'?1:t.repeat==='weekly'?7:30));state.tasks.push({...t,id:crypto.randomUUID(),date:iso(d),done:false})}}
$('#editTask').onclick=()=>{let t=currentDetail;$('#detailModal').classList.remove('show');openForm(t)};$('#addTask').onclick=()=>openForm();$('#prevDay').onclick=()=>shiftDate(-1);$('#nextDay').onclick=()=>shiftDate(1);$('#todayBtn').onclick=()=>{selected=iso(today);render()};function shiftDate(n){let d=dateOf(selected);d.setDate(d.getDate()+n);selected=iso(d);render()}
$$('[data-close]').forEach(b=>b.onclick=()=>b.closest('.overlay').classList.remove('show'));$$('.overlay').forEach(o=>o.onclick=e=>{if(e.target===o)o.classList.remove('show')});$('#petInfo').onclick=()=>toast('完成事項獲得經驗；寵物不會死亡，休息多久都沒關係。');
